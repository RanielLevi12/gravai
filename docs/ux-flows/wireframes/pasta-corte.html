<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Pasta do corte — Wireframe</title>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #e0e0e0;
            display: flex;
            justify-content: center;
            padding: 20px 0;
        }
        .wf-screen {
            width: 375px;
            min-height: 667px;
            background: #f5f5f5;
            border: 2px dashed #ccc;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .wf-header {
            background: #e8e8e8;
            border-bottom: 1px dashed #ccc;
            padding: 12px 16px;
            font-size: 18px;
            font-weight: 600;
            color: #444;
            text-align: center;
        }
        .wf-nav {
            background: #e8e8e8;
            border-bottom: 1px dashed #ccc;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            color: #666;
        }
        .wf-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .wf-input {
            border: 1px dashed #ccc;
            background: #fff;
            padding: 12px;
            font-size: 14px;
            color: #999;
            border-radius: 4px;
        }
        .wf-button {
            background: #ccc;
            border: 1px dashed #999;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #444;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
        }
        .wf-button-secondary {
            background: transparent;
            border: 1px dashed #999;
            padding: 14px;
            font-size: 16px;
            color: #666;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
        }
        .wf-card {
            background: #fff;
            border: 1px dashed #ccc;
            border-radius: 4px;
            padding: 16px;
        }
        .wf-list-item {
            background: #fff;
            border: 1px dashed #ccc;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #666;
        }
        .wf-list-item + .wf-list-item {
            border-top: none;
        }
        .wf-tab-bar {
            background: #e8e8e8;
            border-top: 1px dashed #ccc;
            padding: 8px 0;
            display: flex;
            justify-content: space-around;
            margin-top: auto;
        }
        .wf-tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #888;
        }
        .wf-tab-item.active {
            color: #444;
        }
        .wf-icon-placeholder {
            width: 24px;
            height: 24px;
            background: #ddd;
            border: 1px dashed #bbb;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .wf-icon-placeholder.large {
            width: 48px;
            height: 48px;
        }
        .wf-text-placeholder {
            background: #e0e0e0;
            height: 12px;
            border-radius: 2px;
        }
        .wf-text-placeholder.short { width: 40%; }
        .wf-text-placeholder.medium { width: 70%; }
        .wf-text-placeholder.full { width: 100%; }
        .wf-divider {
            border: none;
            border-top: 1px dashed #ccc;
            margin: 4px 0;
        }
        .wf-spacer {
            height: 16px;
        }
        .wf-label {
            font-size: 12px;
            color: #888;
            font-weight: 500;
        }
        .wf-title {
            font-size: 20px;
            font-weight: 600;
            color: #444;
        }
        .wf-subtitle {
            font-size: 14px;
            color: #888;
        }
        .wf-footer {
            font-size: 10px;
            color: #aaa;
            text-align: center;
            padding: 8px;
            border-top: 1px dashed #ddd;
        }
        a.wf-link {
            color: inherit;
            text-decoration: none;
            display: contents;
        }
        a.wf-link:hover {
            opacity: 0.7;
        }
        a.wf-link:active {
            opacity: 0.5;
        }
        .wf-back {
            font-size: 14px;
            color: #666;
            cursor: pointer;
        }
    
        .wf-chip { display:inline-block; border:1px dashed #999; border-radius:16px; padding:8px 12px; font-size:13px; color:#555; background:#fff; margin:0 6px 6px 0; }
        .wf-chip.sel { background:#ccc; color:#222; font-weight:600; border-style:solid; }
        .wf-chip.off { opacity:.4; }
        .wf-opt { display:flex; gap:12px; align-items:center; background:#fff; border:1px dashed #ccc; border-radius:6px; padding:14px; font-size:15px; color:#444; }
        .wf-opt.sel { border:2px solid #666; background:#eee; }
        .wf-opt small { display:block; color:#888; font-size:12px; }
        .wf-progress { height:6px; background:#ddd; border-radius:3px; }
        .wf-progress > div { height:6px; background:#888; border-radius:3px; }
        .wf-row { display:flex; gap:8px; }
        .wf-row > * { flex:1; }
        .wf-tag { font-size:11px; background:#ddd; border-radius:4px; padding:2px 6px; color:#555; }
        .wf-hint { font-size:12px; color:#999; }
        .wf-cam { flex:1; background:#bbb; position:relative; display:flex; flex-direction:column; }
        .wf-prompter { margin:16px; padding:12px; background:rgba(0,0,0,.55); color:#fff; font-size:20px; line-height:1.4; border-radius:6px; }
        .wf-prompter .now { color:#ffd54f; }
        .wf-sheet { background:#fff; border-top:2px dashed #999; border-radius:12px 12px 0 0; padding:16px; display:flex; flex-direction:column; gap:10px; margin-top:auto; }
        .wf-rec { width:64px; height:64px; border-radius:50%; background:#c44; border:4px solid #fff; margin:0 auto; }
        .wf-video { background:#bbb; aspect-ratio:9/16; max-height:360px; margin:0 auto; width:200px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#555; }
</style>
</head>

</div>
