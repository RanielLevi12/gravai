# Worker sem porta pública: só faz chamadas de saída (Supabase e o app).
# Não há [http_service], então não existe auto_stop do Fly: o próprio worker sai após 60 s ocioso
# e a máquina para (restart "on-failure" só religa se ele cair com erro). O app liga a máquina
# pela API (src/lib/delivery/trigger.ts) quando há pedido e o cron diário liga para limpar.
app = "gravai-worker"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[[restart]]
  policy = "on-failure"
  max_retries = 3

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
